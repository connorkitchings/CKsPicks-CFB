site_name: CKsPicks-CFB
site_description: College-football prediction system documentation.

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - 2026 Direction:
      - Roadmap: planning/roadmap.md
      - Rating-System Requirements: modeling/rating_system_requirements.md
      - Measurement Catalog: modeling/measurement_catalog.md
      - Evaluation: modeling/evaluation.md
      - V4 Regime Contract: modeling/early_season_regimes.md
  - Data Platform:
      - Data Platform 2026: architecture/data_platform_2026.md
      - Point-in-Time Pipeline: architecture/cfbd_point_in_time_pipeline.md
      - Ingestion Guide: data/ingestion_guide.md
      - Provider Audit: cfbd/2026_provider_audit.md
  - Operations:
      - Weekly Pipeline: ops/weekly_pipeline.md
      - Production Runbook: ops/production_runbook.md
      - Successor-v2 Research: ops/rating_successor_research.md
      - Validation: ops/validation.md
      - MLflow Development Tooling: ops/mlflow_mcp.md
  - Model and Experiment Lineage:
      - Feature Registry: project_org/feature_registry.md
      - Experiment Index: experiments/index.md
      - Betting Policy: modeling/betting_policy.md
  - Decisions and Contracts:
      - Decision Log: decisions/decision_log.md
      - Implementation Contracts: plans/index.md
  - Archive: archive.md

exclude_docs: |
  archive/**

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src/cks_picks_cfb]
          options:
            show_root_heading: true
            show_source: true

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
