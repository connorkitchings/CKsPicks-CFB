[project]
name = "cks_picks_cfb"
version = "0.1.0"
description = "An end-to-end college football betting model that predicts point spreads and over/unders."
requires-python = ">=3.12,<3.13"
authors = [{ name = "Connor Kitchings", email = "connor.kitchings@gmail.com" }]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "scipy>=1.13",
    "requests>=2.30",
    "python-dotenv>=1.0",
    "cfbd==5.20.1", # Generated client pinned to the audited CFBD API contract
    "pyarrow>=15.0", # Parquet IO
    "jinja2>=3.1", # Template rendering
    "mlflow>=2.0",
    "hydra-core>=1.3.2",
    "hydra-optuna-sweeper==1.2.0",
    "optuna<3.0.0,>=2.10.0",
    "lightgbm>=4.5.0",
    "catboost>=1.2.9,<2",
    "geopy>=2.4.1",
    "xgboost>=1.5.0",
    "tabulate>=0.9.0",
    "typer>=0.20.0",
    "rich>=13.9.4",
    "boto3>=1.35.0,<2.0.0", # AWS/R2 cloud storage; <2.0.0 guards against breaking SDK changes
    "psycopg[binary]>=3.2", # Neon Postgres access
]

[project.optional-dependencies]
dev = [
    "rich>=13.0",
    "ruff>=0.12.7",
    "ipykernel==6.29.5",
    "pytest>=8.4.1",
    "pandas-stubs==2.2.0.240218",
    "types-requests==2.31.0.20240218",
    "mkdocs-material==9.5.7",
    "mkdocs==1.5.3",
    "mike==2.0.0",
    "seaborn>=0.13.0",
    "matplotlib>=3.8.0",
    "typer>=0.9.0",
]
research = [
    # Research dashboards and local exploration — not needed for pipeline or web app
    "streamlit>=1.30",
    "plotly>=5.18.0",
    # Experimental Bayesian modeling
    "pymc>=5.0.0",
    # Feature attribution analysis
    "shap>=0.50.0",
    # Unused standalone API server
    "fastapi>=0.116.1",
    "uvicorn[standard]>=0.35.0",
]

[tool.ruff]
line-length = 88
extend-exclude = [
    "*.ipynb",
    "**/*.ipynb",
    "archive/**",
    "scripts/archive/**",
    # Retained Week 6 operator evidence; owner-approved validation exclusion.
    "docs/plans/2026-10-11/week6-closeout-evidence/**/capture-tools/**",
]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]



[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "mkdocs-material>=9.5.7",
    "mkdocstrings[python]>=0.28.3",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "typer>=0.9.0",
    "bandit>=1.9.3",
    "pytest>=8.4.1",
    "pytest-mock>=3.15.1",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
]

[tool.pytest.ini_options]
pythonpath = [
  "src",
  "."
]
norecursedirs = [
  "archive",
  "scripts/archive",
  "web",
  "artifacts",
  "contracts",
]

[tool.coverage.run]
source = ["src/cks_picks_cfb"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 60
