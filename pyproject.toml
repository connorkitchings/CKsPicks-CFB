[project]
name = "cks_picks_cfb"
version = "0.1.0"
description = "An end-to-end college football betting model that predicts point spreads and over/unders."
requires-python = ">=3.12,<3.13"
authors = [{ name = "Connor Kitchings", email = "connor.kitchings@gmail.com" }]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "scipy>=1.13",
    "requests>=2.30",
    "python-dotenv>=1.0",
    "omegaconf>=2.3", # Training-policy and capture configs
    "cfbd==5.20.1", # Generated client pinned to the audited CFBD API contract
    "pyarrow>=15.0", # Parquet IO
    "geopy>=2.4.1",
    "boto3>=1.35.0,<2.0.0", # AWS/R2 cloud storage; <2.0.0 guards against breaking SDK changes
    "psycopg[binary]>=3.2", # Neon Postgres access
]

[tool.ruff]
line-length = 88
extend-exclude = [
    "*.ipynb",
    "**/*.ipynb",
    "archive/**",
    # Retained Week 6 operator evidence; owner-approved validation exclusion.
    "docs/plans/2026-10-11/week6-closeout-evidence/**/capture-tools/**",
]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]



[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "ruff>=0.12.7",
    "pytest>=8.4.1",
    "pytest-mock>=3.15.1",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "pandas-stubs==2.2.0.240218",
    "types-requests==2.31.0.20240218",
    "mkdocs==1.5.3",
    "mkdocs-material==9.5.7",
    "mkdocstrings[python]>=0.28.3",
    "mike==2.0.0",
    "matplotlib>=3.8.0",
    "bandit>=1.9.3",
]

[tool.pytest.ini_options]
pythonpath = [
  "src",
  "."
]
norecursedirs = [
  "archive",
  "web",
  "artifacts",
  "contracts",
]

[tool.coverage.run]
source = ["src/cks_picks_cfb"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 60
