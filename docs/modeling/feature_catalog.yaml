# External data sources (for reference)
data_sources:
  - name: rankings
    entity: rankings
    source: CFBD API
    partition_keys: [year, week]
    description: AP and Coaches poll rankings

  - name: recruiting
    entity: recruiting
    source: CFBD API
    partition_keys: [year]
    description: 247Sports team recruiting rankings

  - name: external_ratings
    entity: external_ratings
    source: CFBD API
    partition_keys: [year]
    description: SP+, FPI, and SRS ratings
    rating_types:
      - sp
      - fpi
      - srs

# Pipeline stages
stages:
  - name: byplay
    level: play
    description: Play-level enrichment from raw plays
    input: raw/plays
    output: byplay

  - name: drives
    level: drive
    description: Drive segmentation and aggregation
    input: byplay
    output: drives

  - name: team_game
    level: game
    description: Team-level game statistics
    input: byplay, drives
    output: team_game

  - name: team_season
    level: season
    description: Season-to-date team statistics with recency weighting
    input: team_game
    output: team_season

  - name: opponent_adjusted
    level: season
    description: Iterative opponent strength adjustment
    input: team_season, team_game
    output: team_season
