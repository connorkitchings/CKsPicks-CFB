name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_DAEMON: "false"

jobs:
  lint:
    name: Python lint and contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Validate shared contracts
        run: uv run python contracts/validation.py

      - name: Verify data-quality check registry
        run: PYTHONPATH=src uv run python -m cks_picks_cfb.quality --verify-registry

  pytest:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cks_picks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # test_v5_legacy_freeze_attestation reads the legacy freeze source
          # at a historical commit, which a depth-1 clone does not contain.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev

      - name: Parallel Python tests
        # The files below either reset the one service database or run a
        # threaded rating publication. loadfile only serializes tests within
        # a file; it does not isolate different files from one another.
        run: >-
          PYTHONPATH=src:. uv run pytest tests/ -q -W error
          -n 4 --dist loadfile
          --ignore=tests/test_data_first_possession_rating_runner.py
          --ignore=tests/test_rebuild_6b_flow.py
          --ignore=tests/test_migration_integration.py
          --ignore=tests/test_v5_batch_selection_v2.py
          --ignore=tests/test_publish_matchup_data.py
          --ignore=tests/test_publish_null_lean_database.py
          --cov=cks_picks_cfb --cov-report= --cov-fail-under=0
          --durations=15 -o faulthandler_timeout=300
        env:
          CFBD_API_KEY: ci-placeholder

      - name: Rating publication tests
        run: >-
          PYTHONPATH=src:. uv run pytest
          tests/test_data_first_possession_rating_runner.py
          -q -W error
          --cov=cks_picks_cfb --cov-append --cov-report= --cov-fail-under=0
          --durations=15 -o faulthandler_timeout=300
        env:
          CFBD_API_KEY: ci-placeholder

      - name: PostgreSQL integration tests and total coverage
        # These files reset public/ops/catalog schemas. Run them in one
        # process so a worker cannot drop another test's tables mid-query.
        run: >-
          PYTHONPATH=src:. uv run pytest
          tests/test_migration_integration.py
          tests/test_v5_batch_selection_v2.py
          tests/test_publish_matchup_data.py
          tests/test_publish_null_lean_database.py
          -q -W error
          --cov=cks_picks_cfb --cov-append
          --cov-report=term-missing:skip-covered
          --durations=15 -o faulthandler_timeout=300
        env:
          CFBD_API_KEY: ci-placeholder
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cks_picks_test

  rebuild-flow:
    name: Python 6B rebuild flow
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev

      - name: Twelve-stage rebuild flow
        # Runs all twelve 6B stages (about ten minutes on a runner), so it has
        # its own job instead of pinning one xdist worker for the whole suite.
        # Coverage is measured by the main Python job.
        run: >-
          PYTHONPATH=src:. uv run pytest tests/test_rebuild_6b_flow.py
          -q -W error --durations=5 -o faulthandler_timeout=600
        env:
          CFBD_API_KEY: ci-placeholder

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install Nx dependencies
        run: npm ci

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Lint
        run: npx nx run web:lint

      - name: Build
        run: npx nx run web:build

      - name: Typecheck
        run: npx nx run web:typecheck

      - name: Test publication boundary
        run: npx nx run web:test-publication

      - name: Install browser test runtime
        run: npm --prefix web exec playwright install --with-deps chromium

      - name: Test browser fixtures
        run: npm --prefix web run test:ui
