name: CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Python lint and contracts
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Validate shared contracts
        run: uv run python contracts/validation.py

      - name: Verify data-quality check registry
        run: PYTHONPATH=src uv run python -m cks_picks_cfb.quality --verify-registry

      - name: Build documentation
        run: uv run mkdocs build --strict

  general:
    name: Python general tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COVERAGE_FILE: .coverage.general
      CFBD_API_KEY: ci-placeholder
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Legacy freeze attestation reads source at a historical commit.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev

      - name: Parallel Python tests
        # Shared-database resets and threaded rating publication need isolation.
        run: >-
          PYTHONPATH=src:. uv run pytest tests/ -q -W error
          -n 4 --dist loadfile
          --ignore=tests/test_data_first_possession_rating_runner.py
          --ignore=tests/test_rebuild_6b_flow.py
          --ignore=tests/test_migration_integration.py
          --ignore=tests/test_v5_batch_selection_v2.py
          --ignore=tests/test_publish_matchup_data.py
          --ignore=tests/test_publish_null_lean_database.py
          --ignore=tests/test_season_release_postgres.py
          --cov=cks_picks_cfb --cov-report= --cov-fail-under=0
          --junitxml=junit-general.xml
          --durations=15 -o faulthandler_timeout=300

      - name: Upload general coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-general
          path: .coverage.general
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload general test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-general
          path: junit-general.xml
          if-no-files-found: warn

  ratings:
    name: Python rating publication
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COVERAGE_FILE: .coverage.ratings
      CFBD_API_KEY: ci-placeholder
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev

      - name: Rating publication tests
        run: >-
          PYTHONPATH=src:. uv run pytest
          tests/test_data_first_possession_rating_runner.py
          -q -W error
          --cov=cks_picks_cfb --cov-report= --cov-fail-under=0
          --junitxml=junit-ratings.xml
          --durations=15 -o faulthandler_timeout=300

      - name: Upload ratings coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-ratings
          path: .coverage.ratings
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload ratings test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-ratings
          path: junit-ratings.xml
          if-no-files-found: warn

  database:
    name: Python database integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COVERAGE_FILE: .coverage.database
      CFBD_API_KEY: ci-placeholder
      TEST_DATABASE_URL: postgresql://postgres:${{ github.run_id }}@localhost:5432/cks_picks_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_DB: cks_picks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js for web/database integration
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked web dependencies
        run: npm ci --prefix web

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev

      - name: Provide PostgreSQL 16 server binaries for the private cluster
        shell: bash
        run: |
          if [[ ! -x /usr/lib/postgresql/16/bin/initdb || ! -x /usr/lib/postgresql/16/bin/pg_ctl || ! -x /usr/lib/postgresql/16/bin/postgres ]]; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-16
          fi
          for tool in initdb pg_ctl postgres; do
            test -x "/usr/lib/postgresql/16/bin/$tool"
            "/usr/lib/postgresql/16/bin/$tool" --version
          done
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"

      - name: Require discoverable PostgreSQL 16 server binaries
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          from tests.pg_harness import find_pg_bin
          assert find_pg_bin() == Path("/usr/lib/postgresql/16/bin"), "Private PostgreSQL suite must not skip for missing binaries"
          PY

      - name: PostgreSQL integration tests
        # The first four files reset shared schemas and must run serially.
        # Season-release tests keep their separate, socket-only private cluster.
        run: >-
          PYTHONPATH=src:. uv run pytest
          tests/test_migration_integration.py
          tests/test_v5_batch_selection_v2.py
          tests/test_publish_matchup_data.py
          tests/test_publish_null_lean_database.py
          tests/test_season_release_postgres.py
          -q -W error
          --cov=cks_picks_cfb --cov-report= --cov-fail-under=0
          --junitxml=junit-database.xml
          --durations=15 -o faulthandler_timeout=300

      - name: Upload database coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-database
          path: .coverage.database
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload database test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-database
          path: junit-database.xml
          if-no-files-found: warn

  pytest:
    name: Python tests
    if: always()
    needs: [lint, general, ratings, database]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require successful lint and every Python suite
        env:
          PREREQUISITE_RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          results = json.loads(os.environ["PREREQUISITE_RESULTS"])
          failed = {job: info["result"] for job, info in results.items() if info["result"] != "success"}
          if failed:
              raise SystemExit(f"Required CI jobs did not succeed: {failed}")
          PY

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev

      - name: Download suite coverage
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Require complete coverage and enforce threshold
        run: |
          python - <<'PY'
          from pathlib import Path
          expected = {".coverage.general", ".coverage.ratings", ".coverage.database"}
          actual = {path.name for path in Path(".").glob(".coverage.*") if path.is_file()}
          assert actual == expected, f"Incomplete or unexpected coverage files: {actual}"
          assert all(Path(name).stat().st_size for name in expected), "Empty coverage file"
          PY
          uv run coverage combine
          uv run coverage report --fail-under=60

  web:
    name: Web
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Lint
        run: npm --prefix web run lint

      - name: Build
        run: npm --prefix web run build

      - name: Typecheck
        run: npm --prefix web run typecheck

      - name: Test publication boundary
        run: npm --prefix web run test:publication

      - name: Install browser test runtime
        run: npm --prefix web exec playwright install --with-deps chromium

      - name: Test browser fixtures
        run: npm --prefix web run test:ui

      - name: Test unpublished Charts boundary in a production build
        run: npm --prefix web run test:charts-gate

      - name: Upload browser test failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failures
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore

  python-audit:
    name: Python dependency audit (non-blocking)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev

      - name: Audit Python dependencies
        run: uv run --with pip-audit pip-audit

  web-audit:
    name: Web dependency audit (non-blocking)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Audit web dependencies
        run: npm --prefix web audit --audit-level=high
