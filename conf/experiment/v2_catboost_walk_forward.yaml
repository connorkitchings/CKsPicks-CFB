# @package _global_
# V2 CatBoost Walk-Forward Cross-Validation Configuration
# Expanding window cross-validation using CatBoost model (strictly temporal)

defaults:
  - override /model: catboost_v1
  - override /features: matchup_v1

experiment:
  name: v2_catboost_walk_forward
  phase: 4
  description: "Walk-Forward CV: CatBoost with expanding window (no future data leak)"
  type: walk_forward_cv

# 3-fold selection configuration (strictly temporal)
# Each fold trains only on years BEFORE test year
folds:
  fold_2022:
    name: "fold_2022"
    train_years: [2021]
    test_year: 2022
  fold_2023:
    name: "fold_2023"
    train_years: [2021, 2022]
    test_year: 2023
  fold_2024:
    name: "fold_2024"
    train_years: [2021, 2022, 2023]
    test_year: 2024

# Production refit occurs only after the locked 2025 test.
final_model:
  name: "catboost_walk_forward_final"
  train_years: [2021, 2022, 2023, 2024, 2025]
  deploy_year: 2026

training:
  train_years: [2021, 2022, 2023, 2024]
  test_year: 2025
  deploy_year: 2026

# Same betting config as champion for fair comparison
betting:
  spread:
    default_threshold: 0.0
    high_confidence_threshold: 8.0
  totals:
    threshold: 1.5
  bias_correction:
    spread_offset: 1.14

# Parallel execution settings
parallel:
  enabled: true
  max_workers: 4
  timeout_seconds: 3600  # 1 hour per fold
