# @package _global_
# CatBoost model using internal advanced features with Walk-Forward Cross Validation
# Baseline for comparing advanced internal metrics against external dependency models.

defaults:
  - override /model: catboost_v1
  - override /features: internal_advanced_v1

experiment:
  name: "v2_catboost_internal_adv"
  description: "CatBoost evaluation using internal pace, luck, and turnover features with Walk-Forward CV"
  tags:
    - "v2"
    - "catboost"
    - "internal-features"
    - "walk-forward-cv"
  type: "walk_forward_cv"

# Same betting config as champion for fair comparison
betting:
  spread:
    default_threshold: 0.0
    high_confidence_threshold: 8.0
  totals:
    threshold: 1.5
  bias_correction:
    spread_offset: 1.14

data:
  # Base training years (expanded progressively during CV)
  train_years: [2021, 2022, 2023, 2024]
  # test_year is overridden dynamically by validation script
  test_year: 2025
  adjustment_iteration: 2
  min_games: 4

# 4-fold walk-forward configuration (strictly temporal)
folds:
  fold_2022:
    name: "fold_2022"
    train_years: [2021]
    test_year: 2022
  fold_2023:
    name: "fold_2023"
    train_years: [2021, 2022]
    test_year: 2023
  fold_2024:
    name: "fold_2024"
    train_years: [2021, 2022, 2023]
    test_year: 2024

# Final model: train on all available years, predict 2025
final_model:
  name: "catboost_internal_adv_final"
  train_years: [2021, 2022, 2023, 2024, 2025]
  deploy_year: 2026

training:
  train_years: [2021, 2022, 2023, 2024]
  test_year: 2025
  deploy_year: 2026
