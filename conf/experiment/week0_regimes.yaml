name: game-ordinal-predictive-tournament-2026
workflow: game_ordinal_tournament
training_policy: conf/training/week0_2026.yaml

# Populate with one immutable Gold point-in-time matchup dataset before training.
feature_dataset_ref: null
# Preferred for environment-specific runs: an immutable R2 JSON DatasetRef.
# This avoids embedding preview artifact identities in the committed config.
feature_dataset_ref_uri: null

prior_strengths:
  plays: 100
  drives: 20
  games: 4
# The canonical selection command evaluates the complete reviewed 4×4×4 grid
# with Ridge, then runs CatBoost only on the per-route/formulation finalist.
prior_strength_search: staged_ridge_grid_then_catboost

context_features:
  - prior_season_gap
  - home_neutral_site
  - home_conference_game

# V4 evaluates all-or-nothing point-in-time source families.  A family enters
# a candidate only when it is complete in every required historical fold and
# in the deployment snapshot; CFBD talent remains optional.
preseason_feature_variants:
  - prior_core
  - returning_production
  - transfer_portal
  - recruiting
  - coaching
  - roster_continuity
  - preseason_rankings
  - talent

# Compatibility design of the established Preview v2 direct-Ridge routes.
established_features:
  - home_adj_off_epa_pp
  - home_adj_def_epa_pp
  - home_adj_off_sr
  - home_adj_def_sr
  - away_adj_off_epa_pp
  - away_adj_def_epa_pp
  - away_adj_off_sr
  - away_adj_def_sr
  - home_adj_off_rush_ypp
  - home_adj_def_rush_ypp
  - home_adj_off_pass_ypp
  - home_adj_def_pass_ypp
  - away_adj_off_rush_ypp
  - away_adj_def_rush_ypp
  - away_adj_off_pass_ypp
  - away_adj_def_pass_ypp
  - home_completed_games
  - away_completed_games

baseline_columns:
  spread: baseline_spread_prediction
  total: baseline_total_prediction
output: ${oc.env:CFB_WORK_ROOT,/tmp/cks-picks-cfb}/training/week0-regime-candidates.csv
