# @package _global_
# V2 Walk-Forward Cross-Validation Configuration
# Expanding window cross-validation (strictly temporal, no data leak)

defaults:
  - override /model: linear
  - override /features: matchup_v1

experiment:
  name: v2_walk_forward_cv
  phase: 4
  description: "Walk-Forward CV: Expanding window validation (no future data leak)"
  type: walk_forward_cv

# 4-fold walk-forward configuration (strictly temporal)
# Each fold trains only on years BEFORE test year
folds:
  fold_2021:
    name: "fold_2021"
    train_years: [2019]              # 1 year training
    test_year: 2021
  fold_2022:
    name: "fold_2022"
    train_years: [2019, 2021]        # 2 years training (expanding window)
    test_year: 2022
  fold_2023:
    name: "fold_2023"
    train_years: [2019, 2021, 2022]  # 3 years training (expanding window)
    test_year: 2023
  fold_2024:
    name: "fold_2024"
    train_years: [2019, 2021, 2022, 2023]  # 4 years training (full past data)
    test_year: 2024

# Final model: train on all available years, predict 2025
final_model:
  name: "walk_forward_final"
  train_years: [2019, 2021, 2022, 2023, 2024]
  deploy_year: 2025

training:
  train_years: [2019, 2021, 2022, 2023]  # Used as default
  test_year: 2024  # Not used in CV
  deploy_year: 2025

# Champion model configuration with Phase 4 optimizations
betting:
  spread:
    default_threshold: 0.0
    high_confidence_threshold: 8.0
  totals:
    threshold: 1.5
  bias_correction:
    spread_offset: 1.14

# Parallel execution settings
parallel:
  enabled: true
  max_workers: 4
  timeout_seconds: 3600  # 1 hour per fold
