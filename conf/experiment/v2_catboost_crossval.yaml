# @package _global_
# V2 CatBoost Cross-Validation Configuration
# Expanding-window temporal validation using CatBoost
# Compare against champion (Ridge + matchup_v1): ROI -5.22% ± 6.09%

defaults:
  - override /model: catboost_v1
  - override /features: matchup_v1

experiment:
  name: v2_catboost_crossval
  phase: 4
  description: "Cross-validation: CatBoost model with matchup_v1 features (vs Ridge champion)"
  type: walk_forward_cv

# Frozen 2022-2024 selection folds
folds:
  fold_2022:
    name: "fold_2022"
    train_years: [2021]
    test_year: 2022
  fold_2023:
    name: "fold_2023"
    train_years: [2021, 2022]
    test_year: 2023
  fold_2024:
    name: "fold_2024"
    train_years: [2021, 2022, 2023]
    test_year: 2024

# Final refit after locked 2025 evaluation
final_model:
  name: "catboost_final"
  train_years: [2021, 2022, 2023, 2024, 2025]
  deploy_year: 2026

training:
  train_years: [2021, 2022, 2023, 2024]
  test_year: 2025
  deploy_year: 2026

# Same betting config as champion for fair comparison
betting:
  spread:
    default_threshold: 0.0
    high_confidence_threshold: 8.0
  totals:
    threshold: 1.5
  bias_correction:
    spread_offset: 1.14

# Parallel execution settings
parallel:
  enabled: true
  max_workers: 4
  timeout_seconds: 3600  # 1 hour per fold
