schema_version: data_first_possession_measurement_config_v1
environment: preview
development_seasons: [2015, 2016, 2017, 2018, 2019, 2021, 2022, 2023, 2024, 2025]
forbidden_seasons: [2020]
output_root: artifacts/research/data-first-football-v1/possession-v1/measurements/runs
availability_policy:
  classification: historically_reconstructed
  source_week_relation: strictly_prior_canonical_week
  source_kickoff_buffer_hours: 6
