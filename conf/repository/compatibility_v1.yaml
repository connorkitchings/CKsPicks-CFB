schema_version: repository_compatibility_v1

baseline:
  commit: b930066
  retired_v4_bundle: week0-2026-v4-strict-20260818-r2  # historical only; V5 is the only operational model

research:
  artifact_namespace: artifacts/research/data-first-football-v1/
  command_root: scripts/research
  config_root: conf/research/data_first_football_v1

public_make_targets:
  - prepare-week
  - season-close-week
  - season-revision
  - season-prepare
  - season-release
  - season-rollback
  - reconcile
  - audit-data

required_paths:
  production:
    - Makefile
    - src/cks_picks_cfb/ops/__main__.py
    - src/cks_picks_cfb/ops/state_machine.py
  contracts:
    - contracts/schema.sql
    - contracts/schema.ts
    - contracts/teams.py
    - contracts/teams.ts
    - contracts/migrations
  web:
    - "web/src/app/(games)/page.tsx"
    - web/src/app/api/health/route.ts
    - web/src/lib/schema.ts
    - web/src/lib/teams.ts
  research_structure:
    - scripts/research
    - conf/research/data_first_football_v1
  v5:
    - scripts/research/run_data_first_repair_v2.py
    - scripts/research/verify_data_first_repair_v3.py
    - scripts/research/run_data_first_possession_measurements.py
    - scripts/research/verify_data_first_possession_measurements.py
    - scripts/research/run_data_first_possession_rating_replay.py
    - scripts/research/verify_data_first_possession_rating_replay.py
    - scripts/research/run_v5_live_forecast.py
    - scripts/research/run_v5_shadow_readiness.py
    - scripts/research/verify_v5_shadow.py
    - scripts/pipeline/publish_v5_ratings.py
    - scripts/pipeline/capture_data_first_phase2.py
    - src/cks_picks_cfb/forecast/live.py
    - src/cks_picks_cfb/ratings/possession_live_replay.py
    - conf/weekly_bets/v5_preview_2026.yaml

supported_production_scripts: []

named_research_benchmarks:
  certified_r1_foundation:
    classification: named-benchmark-compatibility
    identity: r1-full-corpus-20260831-5f2a384
    paths:
      - scripts/pipeline/build_successor_r1_foundation.py
      - scripts/pipeline/build_successor_history_ref_set.py
      - scripts/pipeline/certify_successor_history.py
  fixed_rating_baseline:
    classification: named-benchmark-compatibility
    paths:
      - scripts/pipeline/build_rating_measurements.py
      - scripts/pipeline/build_rating_team_states.py
      - src/cks_picks_cfb/ratings/observations.py
      - src/cks_picks_cfb/ratings/states.py
      - conf/ratings/measurement_baseline_v3.yaml
      - conf/ratings/team_state_baseline_v2.yaml

dependency_rules:
  prohibited_import_prefixes:
    - research
    - scripts.research
  prohibited_research_output_prefixes:
    - artifacts/production/
    - lake/production/
    - production/pipeline-runs/
